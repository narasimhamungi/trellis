[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis"
version = "0.1.0"
description = "A hostile-data-grade pipeline from SEC XBRL filings to fully-traced historical statements and a labeled baseline forecast."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narasimha Mungi", email = "narasimhamungi@gmail.com" }]
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
